name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate deployment revision
    uses: ./.github/workflows/quality.yml
    secrets: inherit

  release-risk-gate:
    name: Check release security risks
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout deployment revision
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Enforce release-risk policy
        run: bun run apps/web/scripts/check-release-risks.ts

  deploy:
    name: Deploy validated revision
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs:
      - validate
      - release-risk-gate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
