name: Monorepo Quality Gate

on:
  pull_request:
    branches:
      - main
  workflow_call:
    outputs:
      gate-results:
        description: JSON results for each required release gate
        value: ${{ jobs.validate.outputs.gate-results }}

permissions:
  contents: read

jobs:
  validate:
    name: Complete Monorepo Validation
    runs-on: ubuntu-latest
    outputs:
      gate-results: ${{ steps.summarize.outputs.gate-results }}
    steps:
      - name: Checkout candidate revision
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for Expo
        id: setup-node
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        id: setup-bun
        if: steps.setup-node.outcome == 'success'
        continue-on-error: true
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install workspace dependencies
        id: install
        if: steps.setup-bun.outcome == 'success'
        continue-on-error: true
        run: bun install --frozen-lockfile

      - name: Run root Vitest suite
        id: root-tests
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: bun test

      - name: Run Web Vitest suite
        id: web-tests
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: bun run --filter web test

      - name: Run Web lint and TypeScript checks
        id: eslint-errors
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: bun run --filter web lint

      - name: Build Web production bundle
        id: web-build
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
        run: bun run --filter web build

      - name: Run Mobile Vitest suite
        id: mobile-tests
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: bun run --filter mobile test

      - name: Type-check Mobile
        id: mobile-typecheck
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: bun run --filter mobile typecheck

      - name: Validate Expo public configuration
        id: expo-public-config
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        working-directory: apps/mobile
        run: bunx expo config --type public

      - name: Run shared package Vitest suite
        id: shared-tests
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: bun run --filter @trampotaxa/shared test

      - name: Regenerate shared API clients
        id: api-generation
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: bun run api:generate

      - name: Require generated API artifacts to be current
        id: generated-api-clean
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all -- packages/shared/src/api)" ]]; then
            echo "OpenAPI/Orval generation changed tracked or untracked API artifacts."
            git status --short -- packages/shared/src/api
            exit 1
          fi

      - name: Validate Sonar configuration
        id: sonar-prerequisites
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          if ! grep -Eq '^sonar.organization=.+$' sonar-project.properties; then
            echo "SonarCloud organization is missing from sonar-project.properties."
            exit 1
          fi
          if ! grep -Eq '^sonar.projectKey=.+$' sonar-project.properties; then
            echo "SonarCloud project key is missing from sonar-project.properties."
            exit 1
          fi
          if [[ -z "$SONAR_TOKEN" ]]; then
            echo "SONAR_TOKEN repository secret is required."
            exit 1
          fi

      - name: Analyze with Sonar
        id: sonar-analysis
        if: always() && steps.sonar-prerequisites.outcome == 'success'
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Wait for Sonar quality gate
        id: sonar-quality-gate
        if: always() && steps.sonar-analysis.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 10
        uses: SonarSource/sonarqube-quality-gate-action@v1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Enforce technical-debt ratio below 10%
        id: sonar-debt-ratio
        if: always() && steps.sonar-analysis.outcome == 'success'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          SONAR_PROJECT_KEY="$(sed -n 's/^sonar.projectKey=//p' sonar-project.properties)"
          measure_url="$SONAR_HOST_URL/api/measures/component?component=$SONAR_PROJECT_KEY&metricKeys=sqale_debt_ratio"
          if [[ -n "$SONAR_PULL_REQUEST" ]]; then
            measure_url="${measure_url}&pullRequest=${SONAR_PULL_REQUEST}"
          fi
          response="$(curl --fail --silent --show-error \
            --user "$SONAR_TOKEN:" \
            "$measure_url")"
          ratio="$(jq --exit-status --raw-output \
            '.component.measures[] | select(.metric == "sqale_debt_ratio") | .value' \
            <<< "$response")"
          if ! awk -v value="$ratio" 'BEGIN { exit !(value ~ /^[0-9]+([.][0-9]+)?$/ && value < 10) }'; then
            echo "Sonar technical-debt ratio must be below 10%; reported value: ${ratio:-missing}."
            exit 1
          fi
          echo "Sonar technical-debt ratio: ${ratio}% (required: < 10%)."

      - name: Upload GitHub Pages artifact
        id: pages-artifact
        if: always() && steps.web-build.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/web/dist

      - name: Publish release gate results
        id: summarize
        if: always()
        shell: bash
        run: |
          outcome_status() {
            case "$1" in
              success) printf 'success' ;;
              failure) printf 'failed' ;;
              *) printf 'unavailable' ;;
            esac
          }
          prerequisite_status() {
            if [[ "$1" == success ]]; then
              printf 'success'
            else
              printf 'unavailable'
            fi
          }
          gate_results="$(jq -cn \
            --arg ci "$(prerequisite_status '${{ steps.install.outcome }}')" \
            --arg root "$(outcome_status '${{ steps.root-tests.outcome }}')" \
            --arg web "$(outcome_status '${{ steps.web-tests.outcome }}')" \
            --arg lint "$(outcome_status '${{ steps.eslint-errors.outcome }}')" \
            --arg build "$(outcome_status '${{ steps.web-build.outcome }}')" \
            --arg mobile "$(outcome_status '${{ steps.mobile-tests.outcome }}')" \
            --arg mobile_types "$(outcome_status '${{ steps.mobile-typecheck.outcome }}')" \
            --arg expo "$(outcome_status '${{ steps.expo-public-config.outcome }}')" \
            --arg shared "$(outcome_status '${{ steps.shared-tests.outcome }}')" \
            --arg generate "$(outcome_status '${{ steps.api-generation.outcome }}')" \
            --arg generated "$(outcome_status '${{ steps.generated-api-clean.outcome }}')" \
            --arg sonar_prereq "$(prerequisite_status '${{ steps.sonar-prerequisites.outcome }}')" \
            --arg sonar_quality "$(outcome_status '${{ steps.sonar-quality-gate.outcome }}')" \
            --arg sonar_debt "$(outcome_status '${{ steps.sonar-debt-ratio.outcome }}')" \
            '[
              {gate:"ci-prerequisites", status:$ci},
              {gate:"root-tests", status:$root},
              {gate:"web-tests", status:$web},
              {gate:"eslint-errors", status:$lint},
              {gate:"web-build", status:$build},
              {gate:"mobile-tests", status:$mobile},
              {gate:"mobile-typecheck", status:$mobile_types},
              {gate:"expo-public-config", status:$expo},
              {gate:"shared-tests", status:$shared},
              {gate:"api-generation", status:$generate},
              {gate:"generated-api-clean", status:$generated},
              {gate:"sonar-prerequisites", status:$sonar_prereq},
              {gate:"sonar-quality-gate", status:$sonar_quality},
              {gate:"sonar-debt-ratio", status:$sonar_debt}
            ]')"
          echo "gate-results=$gate_results" >> "$GITHUB_OUTPUT"
          if jq -e 'all(.[]; .status == "success")' <<< "$gate_results" >/dev/null; then
            echo "All required quality gates passed."
          else
            echo "One or more required gates failed or were unavailable:"
            jq -r '.[] | select(.status != "success") | "\(.gate): \(.status)"' <<< "$gate_results"
            exit 1
          fi
