<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrampoTaxa (Loctaxa)</title>
    <meta name="description" content="Plataforma para conectar estabelecimentos contratantes a freelancers para trabalhos temporários e taxas gastronômicas." />
    <meta property="og:title" content="TrampoTaxa (Loctaxa)" />
    <meta property="og:description" content="Plataforma para conectar estabelecimentos contratantes a freelancers para trabalhos temporários e taxas gastronômicas." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0A0B0E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TrampoTaxa" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      (function () {
        var origError = console.error;
        console.error = function () {
          var msg = Array.prototype.slice.call(arguments).map(function (a) {
            return typeof a === 'string' ? a : (a && a.message) || '';
          }).join(' ');
          if (
            msg.indexOf('BillingNotEnabledMapError') !== -1 ||
            msg.indexOf('Google Maps JavaScript API error') !== -1
          ) {
            console.warn(
              '[Google Maps Resiliente] Chave sem faturamento ativo detectada (BillingNotEnabledMapError). A aplicação ativou o motor vetorial interativo nativo.',
              arguments
            );
            try {
              sessionStorage.setItem('gmp_billing_disabled', 'true');
            } catch (e) {}
            window.dispatchEvent(new CustomEvent('gmp_billing_error'));
            if (typeof window.gm_authFailure === 'function') {
              window.gm_authFailure();
            }
            return;
          }
          return origError.apply(console, arguments);
        };
        window.gm_authFailure = function () {
          console.warn('[Google Maps Resiliente] gm_authFailure detectado.');
          try {
            sessionStorage.setItem('gmp_billing_disabled', 'true');
          } catch (e) {}
          window.dispatchEvent(new CustomEvent('gmp_billing_error'));
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
